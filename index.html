<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PayEasy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="splash-screen">
        <h1>💰 PayEasy</h1>
        <p>Smart Payment, Smarter Life!</p>
    </div>
    <div class="login-screen">
    <h2>Welcome Back!</h2>
    <input type="email" placeholder="Email Address">
    <input type="password" placeholder="Password">
    <button>Pay Now</button>
</div>
<div class="home-screen">
    <h2>Hello Nikita!</h2>
    <input type="text" placeholder="Search Food..." class="search-bar">
    
    <h3>Categories</h3>
    <div class="categories">
        <div class="category-item">🍕<br>Pizza</div>
        <div class="category-item">🍔<br>Burger</div>
        <div class="category-item">🍜<br>Noodles</div>
        <div class="category-item">🥗<br>Salad</div>
    </div>

    <h3>Popular Restaurants ⭐</h3>
    <div class="restaurant-card">
        <h4>🍕 Pizza Palace</h4>
        <p>⭐ 4.5 • 30 min • ₹200</p>
    </div>
    <div class="restaurant-card">
        <h4>🍔 Burger King</h4>
        <p>⭐ 4.2 • 25 min • ₹150</p>
    </div>
</div>
<div class="send-money-screen">
    <h2>Send Money 💸</h2>
    <input type="text" placeholder="Recipient Name">
    <input type="text" placeholder="Mobile Number">
    <input type="text" placeholder="₹ 0.00">
    <button>Send Now 🚀</button>
</div>
</body>
</html>
